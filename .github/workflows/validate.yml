name: Validate public showcase

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate public showcase
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run public-safety scan
        run: bash scripts/check-public-safety.sh

      - name: Check shell scripts
        run: |
          bash -n scripts/check-public-safety.sh
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -type f -name '*.sh' \
            -not -path './.git/*' \
            -not -path './scripts/check-public-safety.sh' \
            -print0 | xargs -0 -r shellcheck
